<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(content=~{:: .wsdl-content})}">
<head><title>WSDL Generator - Toodles</title></head>
<body>
<div class="wsdl-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-file-code me-2"></i>WSDL Generator</h2>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form hx-post="/wsdl/generate-htmx"
                  hx-target="#result"
                  hx-indicator="#spinner">
                <div class="mb-3">
                    <label for="wsdlUrl" class="form-label">URL del WSDL</label>
                    <input type="url" name="wsdlUrl" id="wsdlUrl"
                           class="form-control" required
                           placeholder="https://ejemplo.com/service?wsdl">
                </div>
                <button type="submit" class="btn btn-primary">
                    <span id="spinner" class="htmx-indicator">
                        <span class="spinner-border spinner-border-sm me-1"></span>
                    </span>
                    <i class="bi bi-play-fill"></i> Generar clases
                </button>
            </form>
        </div>
    </div>

    <div id="result" class="mt-4">
    </div>
</div>
</body>
</html>
