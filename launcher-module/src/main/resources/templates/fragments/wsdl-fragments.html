<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="result" class="card border-0 shadow-sm"
     th:classappend="${response.status} ? 'border-start border-success border-4' : 'border-start border-danger border-4'">
    <div class="card-body p-4">
        <div class="d-flex align-items-center mb-2">
            <i class="bi fs-4 me-2"
               th:classappend="${response.status} ? 'bi-check-circle-fill text-success' : 'bi-x-circle-fill text-danger'"></i>
            <h5 class="mb-0" th:text="${response.status} ? 'Generación exitosa' : 'Error'"></h5>
        </div>
        <p class="text-muted mb-3" th:if="${response.status}" th:text="|${response.fileCount} archivo(s) generado(s)|"></p>
        <pre class="console-log p-3 mt-2 mb-0" th:text="${response.message}"></pre>
        <a th:if="${response.downloadToken}"
           th:href="@{|/wsdl/download/${response.downloadToken}|}"
           class="btn btn-primary mt-3">
            <i class="bi bi-download me-1"></i> Descargar ZIP
        </a>
    </div>
</div>
</body>
</html>
