<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="result" class="card border-0 shadow-sm border-start border-success border-4">
    <div class="card-body p-4">
        <div class="d-flex align-items-center mb-2">
            <i class="bi bi-check-circle-fill text-success fs-4 me-2"></i>
            <h5 class="mb-0">Refactorización completada</h5>
        </div>
        <p class="text-muted mb-3" th:text="|${fileCount} archivo(s) procesado(s)|"></p>
        <a th:href="@{|/refactor/download/${token}|}"
           class="btn btn-success">
            <i class="bi bi-download me-1"></i> Descargar ZIP
        </a>
    </div>
</div>
</body>
</html>
